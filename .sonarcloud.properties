# Test fixtures are verbatim third-party data (the IANA tz database's zone.tab and backward),
# not code: the analyzer would read their tab-separated rows as PL/SQL.
sonar.exclusions=src/__tests__/fixtures/**
# Each locale is the same Translations shape with different strings; the duplication detector
# ignores string values and reads them as copies. They stay under every other analysis.
sonar.cpd.exclusions=src/i18n/locales/**
