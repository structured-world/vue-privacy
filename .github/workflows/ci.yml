name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # The dev toolchain (vitest 5, jsdom 30) needs Node 22.12+.
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn typecheck

      - name: Build
        run: yarn build

      # Every file package.json exports must be built, so a dependency update that silently
      # drops one fails here instead of in a published release.
      - name: Verify dist
        run: |
          test -f dist/index.js
          test -f dist/vue/index.js
          test -f dist/vitepress/index.js
          test -f dist/quasar/index.js
          test -f dist/vanilla/index.js
          test -f dist/vue-privacy.umd.cjs
          test -f dist/vue-privacy-banner.css
          test -f dist/vue-privacy-modal.css
          test -f dist/index.d.ts
          test -f dist/vue/index.d.ts
          test -f dist/vitepress/index.d.ts
          test -f dist/quasar/index.d.ts
          test -f dist/vanilla/index.d.ts

      - name: Test
        run: yarn test --coverage

      # The docs site has its own toolchain (vitepress on vite 5); building it here keeps a
      # dependency update that breaks it from merging.
      - name: Docs build
        run: yarn docs:build

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: matrix.node-version == '22.x'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
